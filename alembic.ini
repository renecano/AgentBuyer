# Alembic por línea de comandos: `alembic upgrade head` desde la raíz del repo.
# La URL NO va aquí: sale de DATABASE_URL (core/db.database_url), como en la app.
# La app migra sola al arrancar; la CLI sirve para inspeccionar o bajar versiones.
[alembic]
script_location = migrations
prepend_sys_path = .
